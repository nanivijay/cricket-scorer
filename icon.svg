<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cricket bat and ball">
  <defs>
    <linearGradient id="willow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2b368"/>
      <stop offset="1" stop-color="#c49248"/>
    </linearGradient>
    <radialGradient id="leather" cx="0.34" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#f47064"/>
      <stop offset="1" stop-color="#e2443c"/>
    </radialGradient>
    <clipPath id="ball">
      <circle cx="137" cy="144" r="78"/>
    </clipPath>
  </defs>

  <!--
    Transparent, so it sits on a light tab strip or a dark one. That rules out
    anything near white or near black; the palette is all mid-tones, with a dark
    outline to hold the shapes against a pale background.

    Scaled up about the drawing's own centre, since with no background tile the
    padding would just be wasted space.
  -->
  <g transform="translate(256 256) scale(1.26) translate(-245 -225)">
    <!-- Strokes for the whole bat first, so no outline runs through the join
         where the grip overlaps the blade. -->
    <g fill="none" stroke="#4a2c14" stroke-width="29">
      <rect x="179" y="164" width="97" height="233" rx="22" transform="rotate(50 227 281)"/>
      <rect x="336" y="104" width="41" height="136" rx="17" transform="rotate(50 357 172)"/>
    </g>
    <rect x="179" y="164" width="97" height="233" rx="22"
          fill="url(#willow)" transform="rotate(50 227 281)"/>
    <rect x="336" y="104" width="41" height="136" rx="17"
          fill="#7a4f2a" transform="rotate(50 357 172)"/>

    <!-- The ball, in the corner the bat leaves open. -->
    <circle cx="137" cy="144" r="78" fill="url(#leather)"
            stroke="#7c1e1a" stroke-width="29" paint-order="stroke"/>
    <g clip-path="url(#ball)">
      <path d="M159 90 A 34 70 0 0 1 159 199"
            fill="none" stroke="#fff6ec" stroke-width="11"
            stroke-linecap="butt" stroke-dasharray="15 15"/>
    </g>
  </g>
</svg>
