<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine tests — Cricket Over Counter</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 20px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
  }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .lede { color: #6b7280; margin: 0 0 16px; }
  .tally {
    font-weight: 700;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .tally.pass { background: #dcfce7; color: #14532d; }
  .tally.fail { background: #fee2e2; color: #7f1d1d; }
  ol { padding-left: 22px; margin: 0; }
  li { padding: 3px 0; }
  li.fail { color: #b91c1c; font-weight: 600; }
  li .err {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.82rem;
    font-weight: 400;
    padding: 4px 0 4px 12px;
  }
  .ok::marker { color: #16a34a; }
</style>
</head>
<body>
  <h1>Engine and share-link tests</h1>
  <p class="lede">Assertions for <code>engine.js</code> — the Laws of Cricket rules this app exists to get
  right — and for <code>share.js</code>, where a bad encoding would hand someone a wrong scorecard.</p>
  <div id="tally" class="tally">Running…</div>
  <ol id="results"></ol>

<script type="module">
import { runTests } from './tests.js';
import { runShareTests } from './share.tests.js';

const results = [...runTests(), ...runShareTests()];
const passed = results.filter((r) => r.ok).length;

const tally = document.getElementById('tally');
tally.className = `tally ${passed === results.length ? 'pass' : 'fail'}`;
tally.textContent = `${passed}/${results.length} passing`;

document.getElementById('results').replaceChildren(...results.map((r) => {
  const li = document.createElement('li');
  li.className = r.ok ? 'ok' : 'fail';
  li.textContent = r.name;
  if (!r.ok) {
    const err = document.createElement('span');
    err.className = 'err';
    err.textContent = r.error;
    li.append(err);
  }
  return li;
}));
</script>
</body>
</html>
